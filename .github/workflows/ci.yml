name: Windows checks and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Browser extension tests
        run: node --test extension/tests/protocol.test.mjs extension/tests/background.test.mjs
      - name: Parse PowerShell distribution scripts
        shell: pwsh
        run: |
          foreach ($path in @('build.ps1', 'install.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Build Windows release package
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./build.ps1 -Python python -SkipInstall
      - name: Upload Windows ZIP
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: StudyTimeTracker-windows-x64
          path: dist/StudyTimeTracker-*-windows-x64.zip
          if-no-files-found: error
