<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>学习时长统计系统</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span class="brand-mark" aria-hidden="true">时</span><div><h1>学习时长统计系统</h1><p>把专注留给学习</p></div></header>
  <main>
    <section class="connection" aria-live="polite">
      <div class="status-line"><span class="dot" id="status-dot"></span><strong id="status-label">正在读取连接状态…</strong><span class="tag" id="browser">浏览器</span></div>
      <p class="status-detail" id="status-detail">仅连接本机桌面程序。</p>
      <dl><dt>当前域名</dt><dd id="current-domain">—</dd><dt>最近连接</dt><dd id="last-success">—</dd></dl>
    </section>
    <form id="pair-form">
      <label for="pair-token">桌面程序配对码</label>
      <input id="pair-token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴桌面程序提供的配对码" maxlength="128" aria-describedby="token-help">
      <p class="hint" id="token-help">配对码仅保存在当前浏览器，不通过账号同步。</p>
      <button class="primary" id="connect" type="submit">保存并连接</button>
      <button class="secondary" id="disconnect" type="button">断开并清除配对码</button>
      <p class="feedback" id="feedback" role="status"></p>
    </form>
    <aside><strong>只报告当前域名</strong><p>不发送完整网址、网页标题、正文或输入内容。是否计时由桌面程序的白名单、前台窗口和空闲规则决定。</p><p>不向网页注入脚本。支持浏览器中打开的在线 PDF；无痕窗口不统计。</p></aside>
  </main>
  <footer>本机连接 · 127.0.0.1:47831</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
